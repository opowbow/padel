<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="12" y1="8" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="36" y1="34" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="45%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>

  <!-- Rounded Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Padel Racquet (angled -38deg around center) -->
  <g transform="rotate(-38 30 30)">
    <!-- Handle / Grip -->
    <rect x="27" y="44" width="6" height="14" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
    <path d="M27 47.5H33M27 51H33M27 54.5H33" stroke="#475569" stroke-width="1.1"/>
    <!-- Butt Cap -->
    <rect x="26.2" y="56.5" width="7.6" height="2.6" rx="1.2" fill="#f43f5e"/>

    <!-- Y-Throat / Bridge -->
    <path d="M22.5 34L27 44.5H33L37.5 34H22.5Z" fill="url(#rimGrad)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Throat Triangle Cutout -->
    <path d="M26.8 36.2L30 42.2L33.2 36.2H26.8Z" fill="#0f172a"/>

    <!-- Solid Padel Head (Teardrop-Round) -->
    <ellipse cx="30" cy="21.5" rx="14.5" ry="16" fill="#0f172a" stroke="url(#rimGrad)" stroke-width="3.2"/>
    <ellipse cx="30" cy="21.5" rx="11.6" ry="13" fill="#1e293b"/>

    <!-- Signature Padel Perforated Holes -->
    <g fill="#38bdf8">
      <!-- Top row (3 holes) -->
      <circle cx="25.5" cy="13.5" r="1.35"/>
      <circle cx="30" cy="13.5" r="1.35"/>
      <circle cx="34.5" cy="13.5" r="1.35"/>
      <!-- Upper-mid row (4 holes) -->
      <circle cx="23.2" cy="18" r="1.35"/>
      <circle cx="27.7" cy="18" r="1.35"/>
      <circle cx="32.3" cy="18" r="1.35"/>
      <circle cx="36.8" cy="18" r="1.35"/>
      <!-- Center row (4 holes) -->
      <circle cx="23.2" cy="22.5" r="1.35"/>
      <circle cx="27.7" cy="22.5" r="1.35"/>
      <circle cx="32.3" cy="22.5" r="1.35"/>
      <circle cx="36.8" cy="22.5" r="1.35"/>
      <!-- Lower row (3 holes) -->
      <circle cx="25.5" cy="27" r="1.35"/>
      <circle cx="30" cy="27" r="1.35"/>
      <circle cx="34.5" cy="27" r="1.35"/>
    </g>
  </g>

  <!-- Tennis / Padel Ball (Bottom-Right Foreground) -->
  <g>
    <circle cx="46.5" cy="45.5" r="10.5" fill="url(#ballGrad)" stroke="#0f172a" stroke-width="2"/>
    <clipPath id="ballClip">
      <circle cx="46.5" cy="45.5" r="9.5"/>
    </clipPath>
    <g clip-path="url(#ballClip)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M36.5 39C41.5 41.5 43 47.5 39.5 54"/>
      <path d="M56.5 37C51.5 40.5 50 46.5 54 53.5"/>
    </g>
  </g>
</svg>
